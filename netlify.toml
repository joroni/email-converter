# Netlify build + routing config.
[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Send every /api/* request to the Express function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Open the login page first.
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302
